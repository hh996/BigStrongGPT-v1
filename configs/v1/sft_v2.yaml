# 第二轮 SFT：sft_merged + 7B 蒸馏，从第一轮 SFT 权重继续。
stage: sft
swanlab:
  enabled: false
  project: BigStrong2
  workspace: BigHaoHao
  experiment_name: sft_v2
tokenizer_dir: tokenizer/v1
output_dir: output/v1/sft_v2
init_ckpt: output/v1/sft/last.pt
model:
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 2
  vocab_size: 16384
  max_position_embeddings: 32768
data:
  path: dataset/sft_merged_v2.jsonl
  max_samples: null
train:
  epochs: 1
  batch_size: 4
  max_seq_len: 512
  learning_rate: 0.000002
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  accumulation_steps: 2
  log_interval: 20
  save_interval: 500
  num_workers: 0
  max_steps: null
  device: null
